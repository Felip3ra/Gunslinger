schema: spec-driven

context: |
  Projeto: Gunslinger, terminal desktop para Windows 10/11 (Linux/macOS no futuro).
  Stack: Electron 33 + TypeScript estrito, electron-vite, React 18 + zustand, xterm.js 5, node-pty 1.1 (ConPTY), zod, jsonc-parser.
  Arquitetura: main (PTY, FS, ambiente, config) / preload (contextBridge, sandbox) / renderer (UI), IPC tipado em src/shared/ipc-contract.ts.
  Testes: Vitest (unitários em src/**/*.test.ts) e Playwright _electron (tests/e2e).
  Idioma: artefatos e UI em português; código em inglês. Requisitos com SHALL/MUST e cenários GIVEN/WHEN/THEN.
  Convenções completas em CLAUDE.md.

