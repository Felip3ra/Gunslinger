name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    # windows-2022 + Python 3.11: o node-gyp 9 (do @electron/rebuild) só reconhece o Visual Studio até
    # o 2022 e não funciona com o Python 3.12+ (sem distutils).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # O postinstall recompila @vscode/windows-process-tree para a ABI do Electron.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke e2e: abre a janela e um PTY real (valida node-pty/ConPTY no runtime do Electron).
      - run: npx playwright test
      - run: npx electron-builder --win --dir
