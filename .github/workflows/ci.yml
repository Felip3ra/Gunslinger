name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    # windows-2022 + Python 3.11: o node-gyp 9 (do @electron/rebuild) só reconhece o Visual Studio até
    # o 2022 e não funciona com o Python 3.12+ (sem distutils).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # O postinstall recompila @vscode/windows-process-tree para a ABI do Electron.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke e2e: abre a janela e um PTY real (valida node-pty/ConPTY no runtime do Electron).
      - run: npx playwright test
      - run: npx electron-builder --win --dir

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Shells e ferramentas usados pelos testes
        run: sudo apt-get update && sudo apt-get install -y zsh fish lsof xvfb
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --linux --dir
      # Sem user namespaces liberados, o Electron exige o chrome-sandbox do root com SUID (o .deb faz isso
      # ao instalar); sem isso ele aborta em vez de rodar sem sandbox.
      - name: Sandbox do Electron
        run: |
          for f in node_modules/electron/dist/chrome-sandbox dist/linux-unpacked/chrome-sandbox; do
            sudo chown root:root "$f" && sudo chmod 4755 "$f"
          done
      # Os demais testes e2e usam CMD e PowerShell; aqui rodam os de shells nativos e o do app empacotado.
      - run: xvfb-run -a npx playwright test smoke posix packaged

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --mac --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npx playwright test smoke posix packaged
