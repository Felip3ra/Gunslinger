name: Release

# Publica uma versão: crie e envie uma tag igual à versão do package.json.
#   npm version 0.2.0 && git push --follow-tags
# O instalador e o latest.yml (lido pela atualização automática) vão para a release da tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    # windows-2022 + Python 3.11: o node-gyp 9 (do @electron/rebuild) só reconhece o Visual Studio até
    # o 2022 e não funciona com o Python 3.12+ (sem distutils).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Tag igual à versão do package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não corresponde à versão $version do package.json." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Instalador e publicação
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
