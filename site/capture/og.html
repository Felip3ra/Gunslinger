<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; }
    body {
      background: radial-gradient(700px 420px at 85% 0%, #f08a2433, transparent 70%), linear-gradient(160deg, #1a1209, #0b0f16 60%);
      color: #f5ead8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; gap: 64px; padding: 0 90px; box-sizing: border-box;
    }
    .logo svg { width: 300px; height: 300px; filter: drop-shadow(0 30px 40px #000a); }
    h1 { font-size: 92px; margin: 0; letter-spacing: -3px; font-weight: 800; }
    p { font-size: 34px; margin: 16px 0 28px; color: #c9b79c; line-height: 1.25; }
    .tags { display: flex; gap: 12px; }
    .tags span { font-size: 22px; padding: 8px 18px; border-radius: 999px; border: 1px solid #f08a2466; color: #ffc861; background: #f08a2414; }
  </style>
</head>
<body>
  <div class="logo">{{logo}}</div>
  <div>
    <h1>Gunslinger</h1>
    <p>O terminal do Windows para quem vive de .NET e Node.js.</p>
    <div class="tags"><span>EF Core</span><span>npm · pnpm · yarn</span><span>Docker</span><span>Testes</span></div>
  </div>
</body>
</html>
